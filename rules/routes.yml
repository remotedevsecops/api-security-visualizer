# 코드 기반 API 인벤토리 추출 규칙
# 목적: 취약점 탐지가 아니라 "라우트 목록 + 인증 표시"를 뽑아내는 추출기.
# 각 규칙의 metavariable($PATH, $HANDLER 등)을 JSON 출력에서 읽어 apisec/m1/code.py가 조합한다.

rules:
  # ---------- Java Spring (identity) ----------
  - id: spring-class-mapping
    languages: [java]
    severity: INFO
    message: "PATH=$PATH|CLASS=$CLASS"
    pattern: |
      @RequestMapping($PATH)
      class $CLASS { ... }

  - id: spring-method-mapping
    languages: [java]
    severity: INFO
    message: "ANN=$ANN|PATH=$PATH|FUNC=$FUNC"
    patterns:
      - pattern-either:
          - pattern: |
              @$ANN($PATH)
              $RET $FUNC(...) { ... }
          - pattern: |
              @$ANN(value = $PATH, ...)
              $RET $FUNC(...) { ... }
      - metavariable-regex:
          metavariable: $ANN
          regex: ^(Get|Post|Put|Delete|Patch)Mapping$

  - id: spring-security-permitall
    languages: [java]
    severity: INFO
    message: "PATH=$PATH"
    pattern: $X.requestMatchers($PATH).permitAll()

  - id: spring-security-hasrole
    languages: [java]
    severity: INFO
    message: "PATH=$PATH|ROLE=$ROLE"
    pattern: $X.requestMatchers($PATH).hasRole($ROLE)

  # ---------- Go gorilla/mux (community) ----------
  - id: go-mux-route
    languages: [go]
    severity: INFO
    message: "PATH=$PATH|HANDLER=$HANDLER|METHODS=$...METHODS"
    pattern: $R.HandleFunc($PATH, $HANDLER).Methods($...METHODS)

  - id: go-mux-prefix
    languages: [go]
    severity: INFO
    message: "PATH=$PATH|HANDLER=$HANDLER"
    pattern: $R.PathPrefix($PATH).Handler($HANDLER)

  # ---------- Python Django (workshop) ----------
  - id: django-include
    languages: [python]
    severity: INFO
    message: "PATH=$PATH|MODULE=$MODULE"
    pattern-either:
      - pattern: path($PATH, include($MODULE))
      - pattern: re_path($PATH, include($MODULE))

  - id: django-view-route
    languages: [python]
    severity: INFO
    message: "PATH=$PATH|VIEW=$VIEW"
    pattern-either:
      - pattern: re_path($PATH, $MOD.$VIEW.as_view(), ...)
      - pattern: path($PATH, $MOD.$VIEW.as_view(), ...)

  - id: django-view-method
    languages: [python]
    severity: INFO
    message: "VIEW=$VIEW|METHOD=$METHOD"
    patterns:
      - pattern-inside: |
          class $VIEW(...):
              ...
      - pattern: |
          def $METHOD(self, ...):
              ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|delete|patch)$

  - id: django-view-method-auth
    languages: [python]
    severity: INFO
    message: "VIEW=$VIEW|METHOD=$METHOD"
    patterns:
      - pattern-inside: |
          class $VIEW(...):
              ...
      - pattern: |
          @jwt_auth_required
          def $METHOD(self, ...):
              ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|delete|patch)$

  - id: django-admin-site
    languages: [python]
    severity: INFO
    message: "PATH=$PATH"
    pattern-either:
      - pattern: path($PATH, admin.site.urls)
      - pattern: re_path($PATH, admin.site.urls)

