[project]
name = "apisec-toolkit"
version = "0.1.0"
description = "API 보안 가시화 + 가드레일 자율검증 툴킷 (교육/실습용, 로컬 대상 한정)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "pyyaml>=6",
    "rich>=13",
    "jinja2>=3",
    "semgrep>=1.100",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.scripts]
apisec = "apisec.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apisec*"]
